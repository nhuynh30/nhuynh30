<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="2" width="900" height="2"/>
    </clipPath>
  </defs>

  <rect x="0" y="2" width="900" height="2" fill="#e5e7eb"/>

  <g clip-path="url(#clip)">
    <rect x="-260" y="0" width="260" height="6" fill="url(#shimmer)">
      <animate attributeName="x" values="-260;900" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
