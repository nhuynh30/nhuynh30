<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f6ff"/>
    </linearGradient>
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    </symbol>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Sparkles scattered around the text, twinkling with staggered timing -->
  <g fill="#2563eb">
    <use href="#spark" x="60" y="30" width="26" height="26">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#60a5fa">
    <use href="#spark" x="120" y="150" width="34" height="34">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#93c5fd">
    <use href="#spark" x="780" y="40" width="30" height="30">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#2563eb">
    <use href="#spark" x="820" y="160" width="22" height="22">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#3b82f6">
    <use href="#spark" x="40" y="170" width="16" height="16">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#60a5fa">
    <use href="#spark" x="850" y="95" width="18" height="18">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" begin="1.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#bfdbfe">
    <use href="#spark" x="700" y="180" width="14" height="14">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#93c5fd">
    <use href="#spark" x="150" y="60" width="18" height="18">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.3s" begin="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Text -->
  <text x="450" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">
    Hi, I'm Quan Huynh 👋
  </text>
  <text x="450" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">
    Software Engineer · Full-Stack &amp; AI Systems · CS @ George Mason University
  </text>
</svg>
